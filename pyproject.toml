[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-from-zero-lab"
version = "0.1.0"
description = "Small, testable experiments that connect PyTorch behavior to math"
requires-python = ">=3.11"
dependencies = ["torch==2.14.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
pytorch-lab = "pytorch_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
pytorch_lab = ["data/*.csv", "data/*.json", "data/LICENSE.*"]
