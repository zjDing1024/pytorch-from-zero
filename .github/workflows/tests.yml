name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m pytorch_lab --output results/local-ci.json
      - run: python -m pytorch_lab.minibatch_cli --output results/local-ci-minibatch.json
      - run: python -m pytorch_lab.checkpoint_cli verify --output results/local-ci-checkpoint.json
      - run: python -m pytorch_lab.scheduler_cli verify --output results/local-ci-scheduler.json
      - run: python -m pytorch_lab.wine_cli --output results/local-ci-wine.json
