name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Recovery adds a measured ~69s fresh-process matrix plus independent review.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire locked runtime wheels from their official indexes
        run: |
          python -m pip download --only-binary=:all: --no-deps --require-hashes --index-url https://pypi.org/simple -r requirements/runtime-common.lock -d wheelhouse
          python -m pip download --only-binary=:all: --no-deps --require-hashes --index-url https://download.pytorch.org/whl/cpu -r requirements/torch-cpu.lock -d wheelhouse
      - run: |
          python -m pip install --no-index --find-links=wheelhouse --only-binary=:all: --require-hashes -r requirements/runtime-cpu.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check --extend-exclude experiments/wine-saved-forward-2026-10-14/docs/source-before-first-capture.py .
      - run: ruff format --check --extend-exclude experiments/wine-saved-forward-2026-10-14/docs/source-before-first-capture.py .
      - name: Run the main project suite
        run: python -m pytest -q
      - name: Run the three standalone delivery suites
        run: |
          (cd experiments/wine-first-step-2026-10-13 && python -m pytest -q)
          (cd experiments/wine-saved-forward-2026-10-14 && python -m pytest -q)
          (cd tools/wine-delivery && python -m unittest discover -s tests -v)
      - run: python -m pytorch_lab --output results/local-ci.json
      - run: python -m pytorch_lab.minibatch_cli --output results/local-ci-minibatch.json
      - run: python -m pytorch_lab.checkpoint_cli verify --output results/local-ci-checkpoint.json
      - run: python -m pytorch_lab.scheduler_cli verify --output results/local-ci-scheduler.json
      - run: python -m pytorch_lab.wine_cli --output results/local-ci-wine.json
      - run: python -m pytorch_lab.runtime_probe --repeats 2 --output results/local-ci-runtime.json
      - run: python -m pytorch_lab.numerical_probe --repeats 2 --output results/local-ci-numerical.json
      - run: python -m pytorch_lab.fixed_input_probe --repeats 2 --output results/local-ci-fixed-input.json
      - run: python -m pytorch_lab.accumulation_cli --output results/local-ci-accumulation.json
      - run: python -m pytorch_lab.accumulation_recovery_cli --output results/local-ci-accumulation-recovery.json
      - run: python -m pytorch_lab.shuffle_stream_cli --output results/local-ci-shuffle-stream.json
      - run: python validation/verify_shuffle_stream.py > results/local-ci-shuffle-stream-review.json
      - run: python validation/verify_accumulation_recovery.py > results/local-ci-accumulation-recovery-review.json
      - name: Retain full scientific outputs and CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-numerical-evidence
          path: results/local-ci-*.json
          if-no-files-found: error
          retention-days: 30
  installed-cpu-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build hash-locked Linux amd64 CPU wheel image
        run: docker build --platform linux/amd64 --progress plain -t pytorch-lab:cpu .
      - name: Check wheel with no network and a read-only nonroot runtime
        run: |
          docker image inspect pytorch-lab:cpu --format '{{.Id}} {{.Config.User}}'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            pytorch-lab:cpu /checks/check_installed.py > container-installed.json
          cat container-installed.json
      - name: Retain container scientific outputs and CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-numerical-evidence
          path: container-installed.json
          if-no-files-found: error
          retention-days: 30
